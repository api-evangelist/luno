server:
  name: luno-mcp
  description: Official MCP server for the Luno Cryptocurrency API.
  repo: https://github.com/luno/luno-mcp
  language: go
  transport: [stdio, sse, streamable-http]
  default_transport: stdio
  image: ghcr.io/luno/luno-mcp:latest
install:
  docker: docker run --rm -i -e LUNO_API_KEY_ID=... -e LUNO_API_SECRET=... ghcr.io/luno/luno-mcp:latest
  homebrew: brew tap luno/luno-mcp && brew install luno-mcp
  go: go install github.com/luno/luno-mcp/cmd/server@latest
auth:
  env:
    - LUNO_API_KEY_ID
    - LUNO_API_SECRET
  optional_env:
    - LUNO_API_DEBUG
    - LUNO_API_DOMAIN
    - ALLOW_WRITE_OPERATIONS   # write operations disabled by default
