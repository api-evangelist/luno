aid: luno
name: Luno
description: >-
  Luno is a cryptocurrency exchange founded in 2013 and operating across South
  Africa, Nigeria, Europe, Malaysia, Indonesia and other markets, providing
  wallets and the ability to buy, sell, store and trade Bitcoin, Ethereum and
  other digital assets. The Luno API is a REST API (with an accompanying
  WebSocket market-data stream) covering market data, account balances, order
  placement and trading, transfers, sends and withdrawals. It authenticates with
  an API key pair over HTTP Basic and is used by Luno's official Go, Python, PHP
  and Java SDKs and by the official Luno MCP server.
